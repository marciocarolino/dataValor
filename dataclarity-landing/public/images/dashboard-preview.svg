    <rect x="260" y="130" width="96" height="24" rx="999" fill="#EEF3F5" stroke="#D8E0E6"/>
    <rect x="366" y="130" width="110" height="24" rx="999" fill="#EEF3F5" stroke="#D8E0E6"/>
    <rect x="486" y="130" width="88" height="24" rx="999" fill="#EEF3F5" stroke="#D8E0E6"/>
