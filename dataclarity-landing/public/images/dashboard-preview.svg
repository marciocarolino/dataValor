<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mockup premium de dashboard com KPIs e gráficos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFB"/>
      <stop offset="1" stop-color="#EEF3F5"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16A6B6"/>
      <stop offset="1" stop-color="#0FB0C1"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0A0F14" flood-opacity="0.10"/>
    </filter>

    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A0F14" flood-opacity="0.08"/>
    </filter>

    <clipPath id="clipApp">
      <rect x="120" y="110" width="1360" height="760" rx="18"/>
    </clipPath>

    <pattern id="noise" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="62" cy="34" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="28" cy="72" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="80" cy="78" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="44" cy="56" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Backdrop -->
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#noise)"/>

  <!-- App window -->
