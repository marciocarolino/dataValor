    <rect x="120" y="110" width="1360" height="64" rx="18" fill="#F7FAFB"/>
    <rect x="120" y="156" width="1360" height="1" fill="#D8E0E6"/>

    <!-- Window controls -->
    <circle cx="154" cy="142" r="6" fill="#E2E8ED"/>
    <circle cx="176" cy="142" r="6" fill="#E2E8ED"/>
    <circle cx="198" cy="142" r="6" fill="#E2E8ED"/>

