<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração premium de engenharia de dados com pipeline e nós conectados">
  <defs>
    <linearGradient id="bgDE" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F14"/>
      <stop offset="1" stop-color="#10151A"/>
    </linearGradient>
    <linearGradient id="accentDE" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16A6B6"/>
      <stop offset="1" stop-color="#0FB0C1"/>
    </linearGradient>
    <filter id="glowDE" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#16A6B6" flood-opacity="0.24"/>
    </filter>
    <filter id="shadowDE" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="noiseDE" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
      <circle cx="62" cy="34" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
      <circle cx="28" cy="72" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
      <circle cx="80" cy="78" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
      <circle cx="44" cy="56" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="980" fill="url(#bgDE)"/>
  <rect width="1600" height="980" fill="url(#noiseDE)" opacity="0.6"/>

  <!-- Main pipeline surface -->
  <g filter="url(#shadowDE)">
    <rect x="150" y="170" width="1300" height="640" rx="22" fill="#10151A" stroke="#2A3540"/>
  </g>

  <!-- Pipeline lanes -->
  <g opacity="0.9">
    <rect x="210" y="250" width="1180" height="140" rx="20" fill="#0E1318" stroke="#24303A"/>
    <rect x="210" y="420" width="1180" height="140" rx="20" fill="#0E1318" stroke="#24303A"/>
    <rect x="210" y="590" width="1180" height="140" rx="20" fill="#0E1318" stroke="#24303A"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#glowDE)">
    <!-- lane 1 -->
    <rect x="270" y="288" width="240" height="64" rx="18" fill="#0A0F14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <rect x="300" y="308" width="150" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.55"/>
    <rect x="300" y="328" width="110" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.28"/>
    <rect x="468" y="302" width="38" height="38" rx="14" fill="url(#accentDE)" fill-opacity="0.9"/>
    <path d="M480 324l6 6 12-14" stroke="#0A0F14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="560" y="288" width="240" height="64" rx="18" fill="#0A0F14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <rect x="590" y="308" width="160" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.55"/>
    <rect x="590" y="328" width="120" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.28"/>
    <rect x="758" y="302" width="38" height="38" rx="14" fill="#16A6B6" fill-opacity="0.14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <path d="M770 321h16" stroke="#16A6B6" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- lane 2 -->
  <g filter="url(#glowDE)">
    <rect x="320" y="458" width="320" height="64" rx="18" fill="#0A0F14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <rect x="350" y="478" width="210" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.55"/>
    <rect x="350" y="498" width="160" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.28"/>
    <rect x="590" y="472" width="38" height="38" rx="14" fill="#16A6B6" fill-opacity="0.14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <path d="M602 491h16" stroke="#16A6B6" stroke-width="2.8" stroke-linecap="round"/>

    <rect x="700" y="458" width="420" height="64" rx="18" fill="#0A0F14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <rect x="730" y="478" width="250" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.55"/>
    <rect x="730" y="498" width="190" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.28"/>
    <rect x="1060" y="472" width="38" height="38" rx="14" fill="url(#accentDE)" fill-opacity="0.9"/>
    <path d="M1072 492l6 6 12-14" stroke="#0A0F14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lane 3 -->
  <g filter="url(#glowDE)">
    <rect x="270" y="628" width="300" height="64" rx="18" fill="#0A0F14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <rect x="300" y="648" width="190" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.55"/>
    <rect x="300" y="668" width="150" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.28"/>
    <rect x="520" y="642" width="38" height="38" rx="14" fill="#16A6B6" fill-opacity="0.14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <path d="M532 661h16" stroke="#16A6B6" stroke-width="2.8" stroke-linecap="round"/>

    <rect x="610" y="628" width="460" height="64" rx="18" fill="#0A0F14" stroke="#16A6B6" stroke-opacity="0.35"/>
    <rect x="640" y="648" width="270" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.55"/>
    <rect x="640" y="668" width="220" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.28"/>
    <rect x="1020" y="642" width="38" height="38" rx="14" fill="url(#accentDE)" fill-opacity="0.9"/>
    <path d="M1032 662l6 6 12-14" stroke="#0A0F14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Connectors -->
  <g opacity="0.7">
    <path d="M510 320H560" stroke="#16A6B6" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <path d="M640 490H700" stroke="#16A6B6" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <path d="M570 660H610" stroke="#16A6B6" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

    <circle cx="535" cy="320" r="6" fill="#16A6B6" fill-opacity="0.18" stroke="#16A6B6" stroke-opacity="0.35"/>
    <circle cx="670" cy="490" r="6" fill="#16A6B6" fill-opacity="0.18" stroke="#16A6B6" stroke-opacity="0.35"/>
    <circle cx="590" cy="660" r="6" fill="#16A6B6" fill-opacity="0.18" stroke="#16A6B6" stroke-opacity="0.35"/>
  </g>

  <!-- Caption -->
  <g opacity="0.55">
    <rect x="150" y="852" width="320" height="12" rx="6" fill="#D1DAE1" fill-opacity="0.35"/>
    <rect x="150" y="872" width="380" height="10" rx="5" fill="#D1DAE1" fill-opacity="0.20"/>
  </g>
</svg>
