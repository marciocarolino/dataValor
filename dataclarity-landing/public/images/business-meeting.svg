<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração institucional premium de equipe em reunião analisando dados">
  <defs>
    <linearGradient id="bgBM" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFB"/>
      <stop offset="1" stop-color="#EEF3F5"/>
    </linearGradient>
    <linearGradient id="accentBM" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16A6B6"/>
      <stop offset="1" stop-color="#0FB0C1"/>
    </linearGradient>
    <filter id="shadowBM" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0A0F14" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSoftBM" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A0F14" flood-opacity="0.08"/>
    </filter>
    <pattern id="noiseBM" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="62" cy="34" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="28" cy="72" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="80" cy="78" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="44" cy="56" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1600" height="980" fill="url(#bgBM)"/>
  <rect width="1600" height="980" fill="url(#noiseBM)"/>

  <!-- Room surface -->
  <g filter="url(#shadowBM)">
    <rect x="150" y="150" width="1300" height="680" rx="26" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="150" y="150" width="1300" height="120" rx="26" fill="#F7FAFB"/>
    <rect x="150" y="268" width="1300" height="1" fill="#D8E0E6"/>
  </g>

  <!-- Left: presentation board -->
  <g filter="url(#shadowSoftBM)">
    <rect x="230" y="280" width="560" height="420" rx="22" fill="#F7FAFB" stroke="#D8E0E6"/>
    <rect x="270" y="330" width="180" height="14" rx="7" fill="#D1DAE1"/>
    <rect x="270" y="360" width="240" height="10" rx="5" fill="#E2E8ED"/>
    <rect x="270" y="380" width="210" height="10" rx="5" fill="#E2E8ED"/>

    <!-- Chart -->
    <rect x="270" y="430" width="480" height="220" rx="18" fill="#FFFFFF" stroke="#D8E0E6"/>
    <g opacity="0.7">
      <path d="M300 620H720" stroke="#E2E8ED" stroke-width="1"/>
      <path d="M300 580H720" stroke="#E2E8ED" stroke-width="1"/>
      <path d="M300 540H720" stroke="#E2E8ED" stroke-width="1"/>
      <path d="M300 500H720" stroke="#E2E8ED" stroke-width="1"/>
    </g>
    <path d="M320 605C360 575 390 590 430 560C470 530 510 540 550 510C590 480 640 495 690 455"
          stroke="url(#accentBM)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <circle cx="320" cy="605" r="7" fill="#FFFFFF" stroke="#16A6B6" stroke-width="3"/>
      <circle cx="430" cy="560" r="7" fill="#FFFFFF" stroke="#16A6B6" stroke-width="3"/>
      <circle cx="550" cy="510" r="7" fill="#FFFFFF" stroke="#16A6B6" stroke-width="3"/>
      <circle cx="690" cy="455" r="7" fill="#FFFFFF" stroke="#16A6B6" stroke-width="3"/>
    </g>
  </g>

  <!-- Right: people + table (minimal corporate illustration) -->
  <g filter="url(#shadowSoftBM)">
    <!-- Table -->
    <rect x="860" y="620" width="520" height="120" rx="26" fill="#F7FAFB" stroke="#D8E0E6"/>
    <rect x="910" y="652" width="140" height="18" rx="9" fill="#D1DAE1"/>
    <rect x="910" y="684" width="210" height="12" rx="6" fill="#E2E8ED"/>
    <rect x="1230" y="652" width="110" height="48" rx="18" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="1250" y="670" width="70" height="10" rx="5" fill="#D1DAE1"/>

    <!-- Person 1 -->
    <circle cx="970" cy="460" r="44" fill="#EEF3F5" stroke="#D8E0E6"/>
    <path d="M930 560c20-60 80-60 80 0" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="920" y="560" width="100" height="70" rx="24" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="955" y="500" width="30" height="16" rx="8" fill="#16A6B6" fill-opacity="0.12" stroke="#16A6B6" stroke-opacity="0.25"/>

    <!-- Person 2 -->
    <circle cx="1160" cy="440" r="44" fill="#EEF3F5" stroke="#D8E0E6"/>
    <path d="M1120 540c20-60 80-60 80 0" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="1110" y="540" width="100" height="90" rx="24" fill="#0A0F14" fill-opacity="0.92" stroke="#0A0F14"/>
    <rect x="1144" y="480" width="32" height="16" rx="8" fill="url(#accentBM)" fill-opacity="0.9"/>

    <!-- Floating insights -->
    <rect x="1040" y="300" width="260" height="90" rx="20" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="1070" y="332" width="160" height="12" rx="6" fill="#D1DAE1"/>
    <rect x="1070" y="356" width="200" height="10" rx="5" fill="#E2E8ED"/>
    <rect x="1230" y="320" width="44" height="44" rx="16" fill="#16A6B6" fill-opacity="0.12" stroke="#16A6B6" stroke-opacity="0.25"/>
    <path d="M1244 342l7 7 14-16" stroke="#16A6B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Header hint -->
  <g opacity="0.6">
    <rect x="210" y="198" width="180" height="14" rx="7" fill="#D1DAE1"/>
    <rect x="210" y="224" width="260" height="10" rx="5" fill="#E2E8ED"/>
  </g>
</svg>
