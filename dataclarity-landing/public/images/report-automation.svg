<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração premium de automação de relatórios com documentos e fluxo">
  <defs>
    <linearGradient id="bgRA" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFB"/>
      <stop offset="1" stop-color="#EEF3F5"/>
    </linearGradient>
    <linearGradient id="accentRA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16A6B6"/>
      <stop offset="1" stop-color="#0FB0C1"/>
    </linearGradient>
    <filter id="shadowRA" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0A0F14" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSoftRA" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A0F14" flood-opacity="0.08"/>
    </filter>
    <pattern id="noiseRA" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="62" cy="34" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="28" cy="72" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="80" cy="78" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
      <circle cx="44" cy="56" r="1.2" fill="#0A0F14" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1600" height="980" fill="url(#bgRA)"/>
  <rect width="1600" height="980" fill="url(#noiseRA)"/>

  <!-- Base surface -->
  <g filter="url(#shadowRA)">
    <rect x="160" y="160" width="1280" height="660" rx="22" fill="#FFFFFF" stroke="#D8E0E6"/>
  </g>

  <!-- Left: document stack -->
  <g filter="url(#shadowSoftRA)">
    <rect x="250" y="260" width="420" height="520" rx="18" fill="#F7FAFB" stroke="#D8E0E6"/>
    <rect x="285" y="310" width="350" height="70" rx="14" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="305" y="334" width="190" height="12" rx="6" fill="#D1DAE1"/>
    <rect x="305" y="356" width="250" height="10" rx="5" fill="#E2E8ED"/>

    <rect x="285" y="402" width="350" height="70" rx="14" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="305" y="426" width="160" height="12" rx="6" fill="#D1DAE1"/>
    <rect x="305" y="448" width="270" height="10" rx="5" fill="#E2E8ED"/>

    <rect x="285" y="494" width="350" height="70" rx="14" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="305" y="518" width="210" height="12" rx="6" fill="#D1DAE1"/>
    <rect x="305" y="540" width="230" height="10" rx="5" fill="#E2E8ED"/>

    <rect x="285" y="586" width="350" height="70" rx="14" fill="#FFFFFF" stroke="#D8E0E6"/>
    <rect x="305" y="610" width="180" height="12" rx="6" fill="#D1DAE1"/>
    <rect x="305" y="632" width="260" height="10" rx="5" fill="#E2E8ED"/>

    <!-- Accent badge -->
    <rect x="535" y="278" width="120" height="34" rx="999" fill="#DFF6F8" stroke="#16A6B6" stroke-opacity="0.35"/>
    <path d="M560 295l9 9 18-22" stroke="#16A6B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="590" y="292" width="48" height="10" rx="5" fill="#16A6B6" fill-opacity="0.75"/>
  </g>

  <!-- Right: automation flow -->
  <g>
    <!-- Nodes -->
    <g filter="url(#shadowSoftRA)">
      <rect x="820" y="290" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#D8E0E6"/>
      <rect x="852" y="322" width="170" height="12" rx="6" fill="#D1DAE1"/>
      <rect x="852" y="348" width="270" height="10" rx="5" fill="#E2E8ED"/>
      <rect x="852" y="368" width="210" height="10" rx="5" fill="#E2E8ED"/>

      <rect x="1240" y="315" width="54" height="54" rx="16" fill="#16A6B6" fill-opacity="0.12" stroke="#16A6B6" stroke-opacity="0.28"/>
      <path d="M1260 350h14" stroke="#16A6B6" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M1267 343v14" stroke="#16A6B6" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <g filter="url(#shadowSoftRA)">
      <rect x="820" y="468" width="500" height="140" rx="18" fill="#FFFFFF" stroke="#D8E0E6"/>
      <rect x="852" y="500" width="220" height="12" rx="6" fill="#D1DAE1"/>
      <rect x="852" y="526" width="300" height="10" rx="5" fill="#E2E8ED"/>
      <rect x="852" y="546" width="260" height="10" rx="5" fill="#E2E8ED"/>

      <rect x="1240" y="493" width="54" height="54" rx="16" fill="url(#accentRA)" fill-opacity="0.9"/>
      <path d="M1256 521l9 9 20-24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#shadowSoftRA)">
      <rect x="820" y="646" width="500" height="140" rx="18" fill="#F7FAFB" stroke="#D8E0E6"/>
      <rect x="852" y="678" width="190" height="12" rx="6" fill="#D1DAE1"/>
      <rect x="852" y="704" width="280" height="10" rx="5" fill="#E2E8ED"/>
      <rect x="852" y="724" width="230" height="10" rx="5" fill="#E2E8ED"/>

      <rect x="1240" y="671" width="54" height="54" rx="16" fill="#16A6B6" fill-opacity="0.12" stroke="#16A6B6" stroke-opacity="0.28"/>
      <path d="M1256 702h24" stroke="#16A6B6" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M1273 692l9 10-9 10" stroke="#16A6B6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Flow connectors -->
    <path d="M1070 430v38" stroke="#16A6B6" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <path d="M1070 608v38" stroke="#16A6B6" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1070" cy="449" r="6" fill="#16A6B6" fill-opacity="0.18" stroke="#16A6B6" stroke-opacity="0.35"/>
    <circle cx="1070" cy="627" r="6" fill="#16A6B6" fill-opacity="0.18" stroke="#16A6B6" stroke-opacity="0.35"/>
  </g>

  <!-- Caption -->
  <g opacity="0.55">
    <rect x="160" y="852" width="280" height="12" rx="6" fill="#D1DAE1"/>
    <rect x="160" y="872" width="340" height="10" rx="5" fill="#E2E8ED"/>
  </g>
</svg>
