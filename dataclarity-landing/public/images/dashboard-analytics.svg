<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dashboard analytics com KPIs, gráficos e tabela (mockup fictício)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D141B"/>
      <stop offset="1" stop-color="#070B10"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18B6C9"/>
      <stop offset="1" stop-color="#12A1B2"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#26323D" stroke-width="1" opacity="0.55"/>
    </pattern>

    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#F7FAFC" opacity="0.07"/>
      <circle cx="40" cy="28" r="1.2" fill="#F7FAFC" opacity="0.07"/>
      <circle cx="22" cy="52" r="1.2" fill="#F7FAFC" opacity="0.07"/>
    </pattern>

    <clipPath id="clipApp">
      <rect x="120" y="120" width="1360" height="740" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)" opacity="0.35"/>
  <rect width="1600" height="980" fill="url(#dots)" opacity="0.9"/>

  <!-- Glow -->
