<header class="site-header" [class.site-header--open]="isMenuOpen()">
  <div class="site-header__inner container">
    <a class="site-header__brand" href="#top" (click)="closeMenu()">
      {{ brand }}
    </a>

    <nav class="site-header__nav" aria-label="Navegação principal">
      @for (item of navItems; track item.href) {
        @if (item.isRoute) {
          <a
            class="site-header__link site-header__link--cta"
            [routerLink]="item.href"
            (click)="closeMenu()"
            >{{ item.label }}</a
          >
        } @else {
          <a class="site-header__link" [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
        }
      }
    </nav>

    <div class="site-header__actions">
      <app-call-to-action label="Falar com Consultor" href="#contato" variant="dark" />
    </div>

    <button
      class="site-header__burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menu"
    >
      <span class="site-header__burger-line"></span>
      <span class="site-header__burger-line"></span>
    </button>
  </div>

  @if (isMenuOpen()) {
    <div class="site-header__mobile" id="mobile-menu" aria-label="Menu mobile">
      <div class="site-header__mobile-inner container">
        @for (item of navItems; track item.href) {
          @if (item.isRoute) {
            <a
              class="site-header__mobile-link site-header__mobile-link--cta"
              [routerLink]="item.href"
              (click)="closeMenu()"
              >{{ item.label }}</a
            >
          } @else {
            <a class="site-header__mobile-link" [href]="item.href" (click)="closeMenu()">{{
              item.label
            }}</a>
          }
        }

        <app-call-to-action label="Falar com Consultor" href="#contato" variant="primary" />
      </div>
    </div>
  }
</header>
