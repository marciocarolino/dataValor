<header class="site-header" [class.site-header--open]="isMenuOpen()">
  <div class="site-header__inner container">
    <a class="site-header__brand" href="#top" (click)="closeMenu()">
      {{ brand }}
    </a>

    <nav class="site-header__nav" aria-label="Navegação principal">
      <a
        class="site-header__link"
        *ngFor="let item of navItems"
        [href]="item.href"
        (click)="closeMenu()"
        >{{ item.label }}</a
      >
    </nav>

    <div class="site-header__actions">
      <app-call-to-action label="Falar com Consultor" href="#contato" variant="dark" />
    </div>

    <button
      class="site-header__burger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menu"
    >
      <span class="site-header__burger-line"></span>
      <span class="site-header__burger-line"></span>
    </button>
  </div>

  <div class="site-header__mobile" id="mobile-menu" *ngIf="isMenuOpen()" aria-label="Menu mobile">
    <div class="site-header__mobile-inner container">
      <a
        class="site-header__mobile-link"
        *ngFor="let item of navItems"
        [href]="item.href"
        (click)="closeMenu()"
        >{{ item.label }}</a
      >

      <app-call-to-action label="Falar com Consultor" href="#contato" variant="primary" />
    </div>
  </div>
</header>
